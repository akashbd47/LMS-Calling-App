name: Build APK
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch code, e.g. DHAKA (leave empty for a plain APK)"
        required: false
        default: ""
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.inputs.branch }}
      BRANCH_CFG: ${{ secrets[format('{0}_BRANCH', github.event.inputs.branch)] || vars[format('{0}_BRANCH', github.event.inputs.branch)] }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o lms-caller.zip
      - name: Add branch config
        if: env.BRANCH != ''
        run: |
          if [ -z "$BRANCH_CFG" ]; then echo "Secret ${BRANCH}_BRANCH not found"; exit 1; fi
          mkdir -p lms-caller/app/src/main/assets
          printf '%s' "$BRANCH_CFG" > lms-caller/app/src/main/assets/branch.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: lms-caller
        run: gradle assembleRelease --no-daemon
      - name: Name APK
        run: |
          N="KB-LMS${BRANCH:+-$BRANCH}"
          mkdir out
          cp lms-caller/app/build/outputs/apk/release/app-release.apk "out/$N.apk"
          echo "NAME=$N" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*.apk
